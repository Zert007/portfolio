<!DOCTYPE html>
<html lang="en">
<head>
    <<meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400;700&family=Poppins:wght@200&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200&display=swap" rel="stylesheet">
    <title>Portfolio</title>
</head>
<body>
    <header>  
        <div class="container">  
          <nav class="flex items-centre justify-between">  
              <div class="left flex justfiy-right">  
              <div class="logo">  
                <img src="./images/g.png" width="75px" alt="logo">  
              </div>  
              <div>  
                <a href="#">Home</a>  
                <a href="#">About</a>  
                <a href="#">Services</a>  
                <a href="#">Projects</a></li>  
                <a href="#">More</a>  
              </div>  
              </div>  
              <div class="right" href="contact.html">  
                <button class="btn btn-primary">Contact</button>
              </div>  
          </nav>
        </div>  
      </header>

      <!-- contact section-->
    <section id="contact">
      <div class="container mt-3 contactContent">
          <h1 class="text-center">Contact Me</h1>

          <div class="row mt-4">
              <div class="col-lg-6">
                  <!-- to edit google map goto https://www.embed-map.com type your location, generate html code and copy the html  -->
                  <div style="overflow:hidden;max-width:100%;width:350px;height:500px;">
                      <div id="embed-ded-map-canvas" style="height:100%; width:100%;max-width:100%;">
                          <iframe style="height:100%;width:100%;border:0;" frameborder="0" src="https://www.google.com/maps/embed/v1/place?q=WICO+campus+Neerpelt,+Stationsstraat,+Pelt,                              +België&key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8">
                          </iframe>
                          </div>
                          <a class="embed-map-html" rel="nofollow" href="https://www.bootstrapskins.com/themes" id="authmaps-data">premium bootstrap themes</a>
                          <style>#embed-ded-map-canvas img{max-height:none;max-width:none!important;background:none!important;}</style>
                          </div>
              </div>

              <div class="col-lg-6">
                  <!-- form fields -->
                  <form id="contactForm">
                    <input type="text" class="form-control form-control-lg" id="name" placeholder="Name">
                    <input type="email" class="form-control mt-3" id="email" placeholder="Email">
                    <input type="text" class="form-control mt-3" id="subject" placeholder="Subject">
                    <div class="mb-3 mt-3">
                      <textarea class="form-control" rows="5" id="comment" placeholder="Project Details"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Contact Me</button>
                  </form>
                  
                  
                  
              </div>

          </div>
      </div>
  </section>
